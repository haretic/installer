name: haretic installer
on:
  push:
    branches: ['haretic/**']
    tags: ['installer-v*']
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/requirements.txt
      - run: pip install -r packaging/requirements.txt
      - run: python -m pyflakes haretic_installer packaging
      # Clean installs from slot A and B, update, restore, a pulled cable, not-an-r1, against a
      # simulated r1 (sparse files)
      - run: python -m unittest -v haretic_installer.tests.test_flow
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: linux, arch: x64}
          - {os: ubuntu-24.04-arm, target: linux, arch: arm64}
          - {os: windows-2022, target: windows, arch: x64}
          - {os: macos-15-intel, target: macos, arch: x64}
          - {os: macos-15, target: macos, arch: arm64}
    runs-on: ${{ matrix.os }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/requirements.txt
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/installer-v* ]]; then v=${GITHUB_REF_NAME#installer-v}; else v=0.0.0-${GITHUB_SHA::8}; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Linux dependencies
        if: matrix.target == 'linux'
        # libusb to bundle; Qt's runtime libraries for the smoke test; the Flatpak tools
        run: >
          sudo apt-get update && sudo apt-get install -y libusb-1.0-0 flatpak flatpak-builder
          libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1
          libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libdbus-1-3
          libfontconfig1
      - name: macOS dependencies
        if: matrix.target == 'macos'
        run: brew install libusb
      - run: pip install -r packaging/requirements.txt
      - name: Build
        shell: bash
        run: |
          python packaging/scripts/stamp.py "$VERSION" 0
          HI_VERSION=$VERSION pyinstaller --noconfirm --distpath build/dist --workpath build/work packaging/haretic-installer.spec
      - name: Smoke test
        if: matrix.target == 'linux'
        run: |
          build/dist/haretic-installer/haretic-installer --help | grep -q 'install PACKAGE'
          QT_QPA_PLATFORM=offscreen timeout 20 python -c "
          import os, subprocess, time
          p = subprocess.Popen(['build/dist/haretic-installer/haretic-installer', '--demo'], env=dict(os.environ, QT_QPA_PLATFORM='offscreen'))
          time.sleep(8); assert p.poll() is None, 'the window quit'; p.terminate()"
      - name: Linux packages
        if: matrix.target == 'linux'
        run: bash packaging/scripts/package-linux.sh
      - name: Flatpak
        if: matrix.target == 'linux'
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          # The current flatpak-builder from Flathub: the distro's (22.04) still calls
          # appstream-compose, which the 25.08 SDK no longer has
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.flatpak.Builder
          rm -rf build/flatpak-input && mkdir -p build/flatpak-input
          cp -a build/dist/haretic-installer build/flatpak-input/
          flatpak run --user org.flatpak.Builder --user --install-deps-from=flathub --force-clean --repo=build/flatpak-repo build/flatpak packaging/io.github.haretic.installer.yml
          flatpak build-bundle build/flatpak-repo "dist/haretic-installer-${VERSION}-linux-${ARCH}.flatpak" io.github.haretic.installer
      - name: Windows setup and portable
        if: matrix.target == 'windows'
        shell: bash
        run: |
          mkdir -p dist
          iscc=$(ls "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" 2>/dev/null || true)
          if [ -z "$iscc" ]; then choco install innosetup -y --no-progress; iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"; fi
          "$iscc" //DVersion="$VERSION" //DSource="build\\dist\\haretic-installer" packaging/haretic-installer.iss
          python packaging/scripts/stamp.py "$VERSION" 1
          HI_ONEFILE=1 pyinstaller --noconfirm --distpath build/portable --workpath build/work-portable packaging/haretic-installer.spec
          cp build/portable/haretic-installer.exe "dist/haretic-installer-${VERSION}-windows-x64-portable.exe"
      - name: macOS app
        if: matrix.target == 'macos'
        run: bash packaging/scripts/package-macos.sh
      - name: Checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('dist')
          lines = []
          for p in sorted(root.iterdir()):
              h = hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda: f.read(1 << 20), b''):
                      h.update(chunk)
              lines.append(f'{h.hexdigest()}  {p.name}')
          (root / 'SHA256SUMS-${{ matrix.target }}-${{ matrix.arch }}').write_text('\n'.join(lines) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: haretic-installer-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/installer-v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: haretic-installer-*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat dist/SHA256SUMS-* > dist/SHA256SUMS
          rm dist/SHA256SUMS-*
          (cd dist && sha256sum --check SHA256SUMS)
          python3 packaging/scripts/release-notes.py "$TAG" dist > release-notes.md
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --notes-file release-notes.md --title "haretic installer ${TAG#installer-v}" "${flags[@]}"
          fi
